name: CI - Pipeline Tracto Trak

# Se ejecuta en push y PR hacia las ramas principales (main y develop)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ====================================================================
  # JOB 1: Frontend Móvil (Flutter)
  # ====================================================================
  mobile:
    name: Flutter - Analizar y Probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/tracto-track/frontend
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código (Lint)
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar pruebas unitarias y de widgets
        run: flutter test

      - name: Notificar fallo de Flutter en Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"❌ **¡Pipeline CI Falló en Frontend Móvil (Flutter)!**\n\n• **Rama:** \`${{ github.ref_name }}\`\n• **Autor:** \`${{ github.actor }}\`\n• **Commit:** ${{ github.event.head_commit.message }}\n🔗 [Ver ejecución del Pipeline](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}

  # ====================================================================
  # JOB 2: Backend API REST (Node.js + Jest + SonarQube)
  # ====================================================================
  backend:
    name: Node.js - Pruebas, Cobertura y SonarQube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/tracto-track/backend
    steps:
      - name: Descargar repositorio (historial completo para SonarQube)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/tracto-track/backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias e integración con cobertura (Jest)
        run: npm run test:coverage

      - name: Análisis Estático y Quality Gate (SonarQube)
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: app/tracto-track/backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Notificar fallo de Backend / Quality Gate en Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"❌ **¡Pipeline CI Falló en Backend / SonarQube Quality Gate!**\n\n• **Rama:** \`${{ github.ref_name }}\`\n• **Autor:** \`${{ github.actor }}\`\n• **Commit:** ${{ github.event.head_commit.message }}\n🔗 [Ver ejecución del Pipeline](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}
