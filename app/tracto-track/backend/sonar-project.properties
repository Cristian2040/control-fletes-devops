# ====================================================================
# Configuración de SonarQube / SonarCloud - Tracto Trak API REST
# ====================================================================
sonar.projectKey=Cristian2040_control-fletes-devops
sonar.organization=cristian2040
sonar.projectName=Tracto Trak - API REST (Control de Fletes)
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# Reporte de cobertura generado por Jest (lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura (código sin lógica de negocio)
sonar.coverage.exclusions=src/server.js,src/config/database.js

# Codificación de caracteres
sonar.sourceEncoding=UTF-8

# Esperar a que la Quality Gate responda (detiene el pipeline si falla)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
